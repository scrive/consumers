apt: [libpq-dev]
services:
  postgres:
    image: postgres:18
    env:
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    options: >-
      --health-cmd pg_isready
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5
hooks:
  after-setup:
    # cabal runs the test suite and the example at the same time, and both
    # create and drop the table table_versions of hpqtypes-extras.
    - name: Create the test databases
      run: |
        for db in consumers_test consumers_example; do
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "CREATE DATABASE $db"
        done
fourmolu:
  version: '0.20.1.0'
hlint:
  version: '3.10'
